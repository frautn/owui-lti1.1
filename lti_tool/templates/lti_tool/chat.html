<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWebUI LTI Tool</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f6f7fb;
            color: #1c2030;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #d9deef;
            background: #ffffff;
            font-size: 14px;
        }

        .badge {
            background: #e9f0ff;
            border: 1px solid #cbdcff;
            border-radius: 999px;
            padding: 2px 10px;
            font-size: 12px;
        }

        .iframe-wrap {
            height: calc(100% - 49px);
        }

        iframe {
            border: 0;
            width: 100%;
            height: 100%;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div>
            <strong>{{ lti_user.context_title|default:"Course" }}</strong>
            <span class="badge">LTI 1.1</span>
        </div>
        <div>{{ lti_user.lis_person_name_full|default:lti_user.user_id }}</div>
    </div>

    <div class="iframe-wrap">
        <iframe
            src="{{ openwebui_url }}"
            title="OpenWebUI Chat"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="clipboard-read; clipboard-write"
        ></iframe>
    </div>
</body>
</html>
